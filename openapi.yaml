  /createAccountEntry:
    post:
      tags:
        - AccountEntry
      summary: Create a new operation
      operationId: createAccountEntry
      description: Requires amount, wallet.id and type_operation.id. Type 1 stores abs(amount) as income; type 2 stores -abs(amount) as expense. Other active types preserve the supplied sign. Date defaults to current UTC date/time. Optional category, brand and store must belong to the wallet owner and be active.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountEntry'
      responses:
        '200':
          description: AccountEntry successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountEntry'
        '400':
          description: Some of the parameters are not valid
        '500':
          description: Server error
  /updateAccountEntry:
    put:
      tags:
        - AccountEntry
      summary: Update an existing operation
      operationId: updateAccountEntry
      description: Requires id and amount. Updates comment, category, brand, store, date and type. Null or omitted category, brand and store clear the association; omitted date and type preserve existing values. Wallet cannot change. Type 1 stores abs(amount); type 2 stores -abs(amount); other active types preserve the supplied sign. The balance is adjusted by the difference from the previous stored amount.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountEntry'
      responses:
        '200':
