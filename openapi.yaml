        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
        '500':
          description: Server error
  /getUserByEmail/{email}:
    get:
      tags:
        - User
      summary: Get the user by email
      operationId: getUserByEmail
      parameters:
        - in: path
          name: email
          required: true
          description: User ID
          schema:
            type: string
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
        '500':
          description: Server error
  /createUser:
    post:
      tags:
        - User
      summary: Create a new user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: User successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Some of the parameters are not valid
        '500':
          description: Server error
  /updateUser:
    put:
      tags:
        - User
      summary: Update an existing user
      operationId: updateUser
      description: Updates profile fields. Password changes must use /change-password; a nonempty password here returns 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: User successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Some of the parameters are not valid
        '500':
          description: Server error
  /deleteUser/{userId}:
    delete:
      tags:
        - User
      summary: Delete an existing user
      operationId: deleteUser
      parameters:
        - in: path
          name: userId
          required: true
          description: ID of the user to be deleted
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: User successfully deleted
        '404':
          description: User not found
        '500':
          description: Server error
  /me:
    get:
      tags:
      - User
      operationId: getMe
      description: Returns the authenticated user. Never includes a password.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Authentication required
  /account-entries:
    get:
      tags:
      - AccountEntry
      operationId: searchAccountEntries
      description: Only current user entries in active wallets. Dates inclusive in UTC.
        Search matches comment literally, case-insensitive. Stable ordering uses id
        as tie-breaker.
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: walletId
        schema:
          type: integer
          format: int64
          minimum: 1
      - in: query
        name: from
        schema:
          type: string
          format: date
      - in: query
        name: to
        schema:
          type: string
          format: date
      - in: query
        name: categoryId
        schema:
          type: integer
          format: int64
          minimum: 1
      - in: query
        name: typeId
        schema:
          type: integer
          format: int64
          minimum: 1
      - in: query
        name: search
        schema:
          type: string
          maxLength: 200
      - in: query
        name: page
        schema:
          type: integer
          maximum: 21474836
          minimum: 0
          default: 0
      - in: query
        name: size
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - in: query
        name: sortBy
        schema:
          type: string
          enum:
          - date
          - amount
          - id
          default: date
      - in: query
        name: direction
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountEntryPage'
        '400':
          description: Invalid filters
        '401':
          description: Authentication required
        '404':
          description: Wallet not found or not owned by the current user
  /dashboard/summary:
    get:
      tags:
      - Dashboard
      operationId: getDashboardSummary
      description: Only the authenticated user's entries in active wallets. Dates are
        inclusive in UTC. Positive amounts are income; negative amounts are expenses.
        Returns period income, positive expense totals, net and entry count. Balance
        is the current total balance of selected active wallets, independent of date
        filters.
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: walletId
        schema:
          type: integer
          format: int64
          minimum: 1
      - in: query
        name: from
        schema:
          type: string
          format: date
      - in: query
        name: to
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        '400':
          description: Invalid filters
        '401':
          description: Authentication required
        '404':
          description: Wallet not found or not owned by the current user
  /dashboard/by-category:
    get:
      tags:
      - Dashboard
      operationId: getDashboardByCategory
      description: Only the authenticated user's entries in active wallets. Dates are
        inclusive in UTC. Positive amounts are income; negative amounts are expenses.
        Returns period income, positive expense totals, net and count grouped by category.
        Null category identifies uncategorized entries.
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: walletId
        schema:
          type: integer
          format: int64
          minimum: 1
      - in: query
        name: from
        schema:
          type: string
          format: date
      - in: query
        name: to
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryTotals'
        '400':
          description: Invalid filters
        '401':
          description: Authentication required
        '404':
          description: Wallet not found or not owned by the current user
  /dashboard/monthly:
    get:
      tags:
      - Dashboard
      operationId: getDashboardMonthly
      description: Only the authenticated user's entries in active wallets. Dates are
        inclusive in UTC. Positive amounts are income; negative amounts are expenses.
        Returns period income, positive expense totals, net and count grouped by UTC
        calendar month (YYYY-MM). Only months with dated entries are returned.
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: walletId
        schema:
          type: integer
          format: int64
          minimum: 1
      - in: query
        name: from
        schema:
          type: string
          format: date
      - in: query
        name: to
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MonthlyTotals'
        '400':
          description: Invalid filters
        '401':
          description: Authentication required
        '404':
          description: Wallet not found or not owned by the current user
  /change-password:
    post:
      tags:
      - Auth
      operationId: changePassword
      security:
      - bearerAuth: []
      description: Changes own password and invalidates all existing tokens, including
        the current one. Log in again. New passwords need at least 8 characters and
        at most 72 UTF-8 bytes; new password must differ.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed; log in again
        '400':
          description: Invalid new password
        '401':
          description: Authentication required
        '403':
          description: Current password is incorrect
  /me/preferences:
    get:
      tags: [UserPreferences]
      operationId: getMyPreferences
      description: Returns the authenticated user's language preference.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
        '401':
          description: Authentication required
    put:
      tags: [UserPreferences]
      operationId: updateMyPreferences
      description: Updates only the authenticated user's language preference.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPreferences'
      responses:
        '200':
          description: Saved preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
        '400':
          description: Unsupported or missing language
        '401':
          description: Authentication required
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserPreferences:
      type: object
      required: [language]
      properties:
        language:
          type: string
          enum: [es, en]
          default: es
    AuthRequest:
      type: object
      properties:
        username:
          type: string
          example: john_doe
        password:
          type: string
          example: mysecretpassword
      required:
        - username
        - password
    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: Token JWT generado
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    Wallet:
      type: object
      properties:
        id:
          type: integer
          format: int64
        budget:
          type: number
          description: Exact decimal balance with two fractional digits
        comment:
          type: string
        name:
          type: string
        creation_date:
          type: string
          format: date-time
        last_modification:
          type: string
          format: date-time
          description: Date of last change in wallet
        status:
          $ref: '#/components/schemas/Status'
    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
        comment:
          type: string
        name:
          type: string
        last_modification:
          type: string
          format: date-time
          description: Date of last change in category
        status:
          $ref: '#/components/schemas/Status'
    Store:
      type: object
      properties:
        id:
          type: integer
          format: int64
        comment:
          type: string
        name:
          type: string
        last_modification:
          type: string
          format: date-time
          description: Date of last change in store
        status:
          $ref: '#/components/schemas/Status'
    Brand:
      type: object
      properties:
        id:
          type: integer
          format: int64
        comment:
          type: string
        name:
          type: string
        last_modification:
          type: string
          format: date-time
          description: Date of last change in brand
        status:
          $ref: '#/components/schemas/Status'
    Status:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    Role:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        comment:
          type: string
        status:
          $ref: '#/components/schemas/Status'
    AccountEntry:
      type: object
      properties:
        id:
          type: integer
          format: int64
        amount:
          type: number
          format: number
        wallet:
          $ref: '#/components/schemas/Wallet'
        comment:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        date:
          type: string
          format: date
        brand:
          $ref: '#/components/schemas/Brand'
        store:
          $ref: '#/components/schemas/Store'
        type_operation:
          $ref: '#/components/schemas/AccountEntryType'
    AccountEntryType:
      type: object
      properties:
        id:
          type: integer
          format: int64
        comment:
          type: string
        status:
          $ref: '#/components/schemas/Status'
        name:
          type: string
        last_modification:
          type: string
          format: date-time
          description: Date of last change in transaction type
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        password:
          type: string
          writeOnly: true
        email:
          type: string
        comment:
          type: string
        record_date:
          type: string
          format: date-time
        role:
          $ref: '#/components/schemas/Role'
    ChangePasswordRequest:
      type: object
      required:
      - currentPassword
      - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 72
          writeOnly: true
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
          writeOnly: true
    AccountEntryPage:
      type: object
      required:
      - items
      - page
      - size
      - totalElements
      - totalPages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccountEntry'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    DashboardSummary:
      type: object
      required:
      - income
      - expenses
      - net
      - entryCount
      - balance
      properties:
        income:
          type: number
          description: Exact decimal amount, maximum two fractional digits
        expenses:
          type: number
          description: Exact decimal amount, maximum two fractional digits
        net:
          type: number
          description: Exact decimal amount, maximum two fractional digits
        entryCount:
          type: integer
          format: int64
        balance:
          type: number
          description: Exact decimal amount, maximum two fractional digits
    CategoryTotals:
      type: object
      required:
      - income
      - expenses
      - net
      - entryCount
      - categoryId
      - categoryName
      properties:
        income:
          type: number
          description: Exact decimal amount, maximum two fractional digits
        expenses:
          type: number
          description: Exact decimal amount, maximum two fractional digits
        net:
          type: number
          description: Exact decimal amount, maximum two fractional digits
        entryCount:
          type: integer
          format: int64
        categoryId:
          type: integer
          format: int64
          nullable: true
        categoryName:
          type: string
          nullable: true
    MonthlyTotals:
      type: object
      required:
      - income
      - expenses
      - net
      - entryCount
      - month
      properties:
        income:
          type: number
          description: Exact decimal amount, maximum two fractional digits
        expenses:
          type: number
          description: Exact decimal amount, maximum two fractional digits
        net:
          type: number
          description: Exact decimal amount, maximum two fractional digits
        entryCount:
          type: integer
          format: int64
        month:
          type: string
          example: 2026-10
