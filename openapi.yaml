openapi: 3.0.3
info:
  title: Java Accounting
  description: The Accounting service is responsible for sending and receiving information about user operations.
  version: 1.5.0
servers:
  - url: 'http://localhost:8080/cash-balance'
tags:
  - name: UserPreferences
    description: Authenticated user preferences
  - name: Auth
    description: Auth endpoints
  - name: Wallet
    description: User wallets
  - name: Category
    description: Category of the operation performed by the user
  - name: Status
    description: Current status of the related entity
  - name: Brand
    description: Brand of the operation performed by the user
  - name: AccountEntry
    description: Operations made by the user
  - name: Role
    description: User role
  - name: Store
    description: Store of the operation performed by the user
  - name: AccountEntryType
    description: AccountEntry Type performed by the user
  - name: User
    description: User data registered in the system
  - name: Dashboard
    description: Current user statistics
paths:
  /login:
    post:
      tags:
        - Auth
      summary: Autentica un usuario y devuelve un token JWT
      operationId: login
      requestBody:
        required: true
        description: User credentials
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Autenticación correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Credenciales incorrectas
        '500':
          description: Error interno del servidor
  /wallets:
    get:
      tags:
        - Wallet
      summary: Gets all wallets
      operationId: getWallets
      responses:
        '200':
          description: List of wallets found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Wallet'
        '500':
          description: Server error
    post:
      tags:
        - Wallet
      summary: Crea una nueva wallet
      operationId: createWallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Wallet'
      responses:
        '200':
          description: Wallet creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '400':
          description: Some of the parameters provided are not valid.
        '500':
          description: Server error
  '/getWalletsByUserId/{userId}':
    get:
      tags:
        - Wallet
      summary: Obtains a wallet by user ID
      operationId: getWalletsByUserId
      parameters:
        - in: path
          name: userId
          required: true
          description: User ID to be obtained
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Wallet found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Wallet'
        '404':
          description: Wallet not found
        '500':
          description: Server error
  /deleteWallet/{walletId}:
    delete:
      tags:
        - Wallet
      summary: Delete an existing wallet
      operationId: deleteWallet
      parameters:
        - in: path
          name: walletId
          required: true
          description: ID of the wallet to be deleted
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Wallet successfully deleted
        '404':
          description: Wallet not found
        '500':
          description: Server error
  '/wallet/{walletId}':
    get:
